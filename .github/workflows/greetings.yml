name: Greetings
on: [pull_request_target, issues] # 当有人提 PR 或 Issue 时触发
jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "欢迎来到我的项目！感谢你提出第一个 Issue。"
        pr-message: "太棒了！这是你第一次为本项目贡献代码，我们会尽快审阅。"
